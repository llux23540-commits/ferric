name: Release

# 推送 v* 标签触发发版：
#   git tag v0.5.0 && git push origin v0.5.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            formats: nsis
          # 首发只出 Windows；发全平台时取消下面注释
          # - os: macos-latest
          #   target: macos-aarch64
          #   formats: dmg
          # - os: macos-13
          #   target: macos-x86_64
          #   formats: dmg
          # - os: ubuntu-latest
          #   target: linux-x86_64
          #   formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建号 = git 提交数（ferric-ui/build.rs），浅克隆会算错
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败的运行也保存缓存，避免下次全量重编译
          cache-on-failure: true
      - run: cargo build --release -p ferric-app
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager
        # binstall 直接下载预编译二进制，比 cargo install 从源码编译快一个数量级
        run: cargo binstall -y cargo-packager
      - name: Package installers
        shell: bash
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir packages
      - name: Collect artifacts
        shell: bash
        run: |
          echo "== packages 目录内容 =="
          find packages -type f -print || true
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          tgt="${{ matrix.target }}"
          copy_one() { # copy_one <查找模式> <目标文件名>
            src=$(find packages -maxdepth 2 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find target/release -maxdepth 1 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find . -maxdepth 3 -type f -name "$1" -not -path './target/*' 2>/dev/null | head -n 1)
            if [ -z "$src" ]; then
              echo "::error::未找到匹配 $1 的产物；全盘搜索：$(find . -maxdepth 4 -name "$1" 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
            echo "::notice::找到产物 $src"
            cp "$src" "dist/$2"
          }
          case "$tgt" in
            windows-*)
              copy_one "*setup*.exe" "ferric-${tag}-${tgt}-setup.exe"
              # 免安装便携版：单二进制直接分发
              cp target/release/ferric.exe "dist/ferric-${tag}-${tgt}-portable.exe"
              ;;
            macos-*)
              copy_one "*.dmg" "ferric-${tag}-${tgt}.dmg"
              ;;
            linux-*)
              copy_one "*.deb" "ferric-${tag}-${tgt}.deb"
              copy_one "*.AppImage" "ferric-${tag}-${tgt}.AppImage"
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
