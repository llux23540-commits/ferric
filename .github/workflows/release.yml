name: Release

# 推送 vX.Y.Z 标签触发发版（发版是显式动作：不打 tag 什么都不会构建）。
# 版本 = tag 本身；规则：下一个 = 上一个末位 +1，满千进位第二位（锚点 v0.2.0，
# 首个新式 tag 为 v0.2.1）。生成并推送下一个 tag：
#   last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1); last=${last:-v0.2.0}
#   IFS=. read -r a b c <<< "${last#v}"; c=$((c+1)); [ "$c" -ge 1000 ] && { b=$((b+1)); c=0; }
#   git tag "v$a.$b.$c" && git push origin "v$a.$b.$c"
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            formats: nsis
          # Windows on ARM（骁龙本等）。x64 版靠模拟也能跑，原生包性能/续航更好。
          # NSIS 的 makensis 是 x86 程序，在 ARM Windows 上走模拟执行，可用。
          - os: windows-11-arm
            target: windows-aarch64
            formats: nsis
          - os: macos-latest
            target: macos-aarch64
            formats: dmg
          # Intel Mac：macos-13 已于 2025-12 退役，x86_64 用 macos-15-intel（GitHub 提供至 2027-08）
          - os: macos-15-intel
            target: macos-x86_64
            formats: dmg
          - os: ubuntu-latest
            target: linux-x86_64
            formats: deb,appimage
          # Linux ARM64（树莓派 / ARM 服务器 / Asahi 等）。
          # arm64 的 AppImage 打包链路已在 aarch64 开发机上预飞行验证。
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建号 = git 提交数（ferric-ui/build.rs），浅克隆会算错
          fetch-depth: 0
      - name: 按标签定版（版本 = tag 去掉 v，写回 Cargo.toml 供打包）
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::标签 $GITHUB_REF_NAME 不是 vX.Y.Z 形式"; exit 1; }
          # $done ||= s///：只替换第一处 ^version（即 [workspace.package] 那行）；
          # 守卫必须在替换**成功**后才置位。
          perl -pi -e '$done ||= s/^version = "[^"]+"/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "::error::版本覆写失败"; exit 1; }
          # 序号自查：按「上一个末位 +1、满千进位」推出期望值，不符只提醒不拦截。
          # 结尾 || true 必须有：首个发布时列表筛掉自己后为空，grep 退出码 1，
          # GitHub 的 bash 是 -eo pipefail，没有它整步直接判死（v0.2.1 首跑就栽在这）。
          prev=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          prev=${prev:-v0.2.0}
          IFS=. read -r a b c <<< "${prev#v}"
          c=$((c+1)); if [ "$c" -ge 1000 ]; then b=$((b+1)); c=0; fi
          if [ "$GITHUB_REF_NAME" != "v$a.$b.$c" ]; then
            echo "::warning::标签 $GITHUB_REF_NAME 不是 $prev 的顺位下一个（应为 v$a.$b.$c）"
          fi
          echo "::notice::发布版本 $v（上一个 $prev）"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
          # appimagetool 本体是个 AppImage，挂载需要 fuse2（24.04 里叫 libfuse2t64）
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败的运行也保存缓存，避免下次全量重编译
          cache-on-failure: true
      - run: cargo build --release -p ferric-app
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager
        # binstall 直接下载预编译二进制，比 cargo install 从源码编译快一个数量级
        run: cargo binstall -y cargo-packager
      - name: Package installers
        shell: bash
        # out-dir 必须用绝对路径（相对路径会被解析到 crate 目录），
        # 且要用 GITHUB_WORKSPACE 的原生路径格式（$PWD 在 Windows bash 下是 POSIX 风格，原生程序解析不了）
        env:
          # 无 fuse 环境的兜底：linuxdeploy/appimagetool 改走解压直跑，其他平台忽略此变量
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir "$GITHUB_WORKSPACE/packages"
      - name: Collect artifacts
        shell: bash
        run: |
          echo "== packages 目录内容 =="
          find packages -type f -print || true
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          tgt="${{ matrix.target }}"
          copy_one() { # copy_one <查找模式> <目标文件名>
            src=$(find packages -maxdepth 2 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find target/release -maxdepth 1 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find . -maxdepth 4 -type f -name "$1" -not -path './target/*' 2>/dev/null | head -n 1)
            if [ -z "$src" ]; then
              echo "::error::未找到匹配 $1 的产物；全盘搜索：$(find . -maxdepth 4 -name "$1" 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
            echo "::notice::找到产物 $src"
            cp "$src" "dist/$2"
          }
          case "$tgt" in
            windows-*)
              copy_one "*setup*.exe" "ferric-${tag}-${tgt}-setup.exe"
              # 免安装便携版：单二进制直接分发
              cp target/release/ferric.exe "dist/ferric-${tag}-${tgt}-portable.exe"
              ;;
            macos-*)
              copy_one "*.dmg" "ferric-${tag}-${tgt}.dmg"
              ;;
            linux-*)
              copy_one "*.deb" "ferric-${tag}-${tgt}.deb"
              copy_one "*.AppImage" "ferric-${tag}-${tgt}.AppImage"
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 下载指引置顶（自动生成的变更记录会接在后面）。
          # aarch64 曾被误认为「缺 ARM Mac 版」——对普通用户要写「Apple 芯片」。
          body: |
            ## 下载指引
            | 你的机器 | 下载哪个 |
            |---|---|
            | Windows · Intel / AMD（x64，最常见） | `*-windows-x86_64-setup.exe`（安装版）· `*-portable.exe`（免安装） |
            | Windows · ARM（骁龙 Snapdragon 本） | `*-windows-aarch64-setup.exe` · 对应 portable |
            | Mac · Apple 芯片（M1–M4） | `*-macos-aarch64.dmg` |
            | Mac · Intel | `*-macos-x86_64.dmg` |
            | Linux · Intel / AMD（x64） | `*-linux-x86_64.deb`（Debian/Ubuntu）· `.AppImage`（任意发行版） |
            | Linux · ARM64（树莓派等） | `*-linux-aarch64.deb` · 对应 `.AppImage` |

            > x64 = x86_64 = amd64，同一个东西的三种叫法：Intel 与 AMD 的处理器都用它。
