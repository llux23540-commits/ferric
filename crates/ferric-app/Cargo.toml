[package]
name = "ferric-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[dependencies]
ferric-ui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# eframe 只用 wgpu 的默认后端集，未开 Windows 的 DX12 后端。
# 显式启用 dx12（feature 合并到 eframe 共用的 wgpu 构建），
# 否则在无 Vulkan 驱动 / GL 仅 1.1 的环境（如 QEMU 虚拟机的 WARP 软件渲染）下找不到适配器。
# 版本必须与 eframe 0.36 所用 wgpu（30.x）一致。
wgpu = { version = "30", default-features = false, features = ["dx12"] }
# 软渲染后端：纯 CPU 光栅化 egui 的图形，softbuffer 把位图贴到窗口，
# 完全绕过 GPU API —— 虚拟机 / 无 GPU 环境下进程内存从 ~650MB 降到 ~150MB。
ferric-soft-render = { workspace = true }

[build-dependencies]
# 把 icon.ico 嵌进 Windows exe 的 PE 资源（见 build.rs）。
winresource = "0.1"

# 打包配置（cargo-packager）。安装：cargo install cargo-packager
# 构建产物：cargo packager --release
[package.metadata.packager]
product-name = "Ferric"
identifier = "dev.ferric.app"
description = "跨平台原生 Rust 开发者工具箱"
authors = ["Ferric"]
formats = ["dmg", "nsis", "deb", "appimage"]
# 各平台按扩展名自取：ico → Windows(NSIS)，icns → macOS(dmg)，png → Linux(deb/appimage)。
# 图标源文件与再生成方式见 icons/generate.py。
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.png",
    "icons/icon.ico",
    "icons/icon.icns",
]

[package.metadata.packager.nsis]
# 定制安装模板：**升级直接覆盖安装**，不再弹「已安装旧版，是否先卸载」页。
# 基线 = cargo-packager v0.11.8 内置模板 + 一处补丁（见文件头注释）。
# CI 已把 cargo-packager 钉在同版本，防止上游占位符漂移导致模板失配。
# 路径相对本 crate 目录（cargo-packager 打包时会先 chdir 进包目录，实测 strace 为证）。
template = "nsis/installer.nsi"

[package.metadata.packager.macos]
# ad-hoc 签名（"-"，不需要 Apple 证书）。cargo-packager 不配 signing-identity 就
# **完全不签**，而 Apple Silicon 对未签名 .app 直接判「已损坏，无法打开」，连
# 放行入口都没有（v0.2.1 拆包实证：bundle 里没有 _CodeSignature）。ad-hoc 之后
# 首次打开走「系统设置 → 隐私与安全性 → 仍要打开」。将来有 Developer ID 证书时，
# 这里换成证书名并在 CI 配 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD。
signing-identity = "-"
