[package]
name = "ferric-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ferric-core = { workspace = true }

# GUI: 从 eframe/egui 切到 Slint 1.17。Software renderer 是默认 + 无 GPU 兜底，
# 完整保留 ferric 之前的「任何机器都能跑」承诺。
slint = { version = "1.17", default-features = false, features = ["renderer-software", "backend-winit", "std", "libm", "image-default-formats", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
rfd = { workspace = true }
directories.workspace = true
libsm = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# 编辑区的文本存储（src/editor.rs：rope + 视口虚拟化，见下面被它取代的两个 egui crate）
ropey = { workspace = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
chrono = { workspace = true }

# 保留 wasmtime（plugin_host 不动）+ ferric-core 的全部加密 / 序列化能力。
wasmtime = "27.0.0"

# 移除（迁到 Slint 后不再需要）：
# - eframe / egui：UI 框架本身
# - egui-rope-editor / egui_json_tree：都绑在 egui 的 Galley/Painter 上，没法移植。
#   它们的职责由 src/editor.rs 承接（ropey 存文本 + 只渲染可见行）。

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
ureq = { workspace = true }