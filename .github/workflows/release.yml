name: Release

# 推送 v* 标签触发发版。版本号由构建号推导（主版本.构建号/1000.构建号%1000），
# 标签应取推导版本：n=$(git rev-list --count HEAD); echo "v0.$((n/1000)).$((n%1000))"
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            formats: nsis
          - os: macos-latest
            target: macos-aarch64
            formats: dmg
          # Intel Mac：macos-13 已于 2025-12 退役，x86_64 用 macos-15-intel（GitHub 提供至 2027-08）
          - os: macos-15-intel
            target: macos-x86_64
            formats: dmg
          - os: ubuntu-latest
            target: linux-x86_64
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 构建号 = git 提交数（ferric-ui/build.rs），浅克隆会算错
          fetch-depth: 0
      - name: 推导版本号（公式与 crates/ferric-ui/build.rs 保持一致）
        shell: bash
        run: |
          n=$(git rev-list --count HEAD)
          major=$(sed -n 's/^version = "\([0-9]*\)\..*/\1/p' Cargo.toml | head -n1)
          v="${major:-0}.$((n / 1000)).$((n % 1000))"
          # 覆写 workspace 版本供打包用。$done ||= s///：只替换第一处 ^version
          #（即 [workspace.package] 那行）；守卫必须在替换**成功**后才置位。
          perl -pi -e '$done ||= s/^version = "[^"]+"/version = "'"$v"'"/' Cargo.toml
          grep -q "^version = \"$v\"" Cargo.toml || { echo "::error::版本覆写失败"; exit 1; }
          echo "::notice::推导版本 v$v（构建号 $n，标签 $GITHUB_REF_NAME）"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::warning::标签 $GITHUB_REF_NAME ≠ 推导版本 v$v —— 产物文件名用标签，安装包内部版本用推导值"
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
          # appimagetool 本体是个 AppImage，挂载需要 fuse2（24.04 里叫 libfuse2t64）
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败的运行也保存缓存，避免下次全量重编译
          cache-on-failure: true
      - run: cargo build --release -p ferric-app
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager
        # binstall 直接下载预编译二进制，比 cargo install 从源码编译快一个数量级
        run: cargo binstall -y cargo-packager
      - name: Package installers
        shell: bash
        # out-dir 必须用绝对路径（相对路径会被解析到 crate 目录），
        # 且要用 GITHUB_WORKSPACE 的原生路径格式（$PWD 在 Windows bash 下是 POSIX 风格，原生程序解析不了）
        env:
          # 无 fuse 环境的兜底：linuxdeploy/appimagetool 改走解压直跑，其他平台忽略此变量
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir "$GITHUB_WORKSPACE/packages"
      - name: Collect artifacts
        shell: bash
        run: |
          echo "== packages 目录内容 =="
          find packages -type f -print || true
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          tgt="${{ matrix.target }}"
          copy_one() { # copy_one <查找模式> <目标文件名>
            src=$(find packages -maxdepth 2 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find target/release -maxdepth 1 -type f -name "$1" 2>/dev/null | head -n 1)
            [ -z "$src" ] && src=$(find . -maxdepth 4 -type f -name "$1" -not -path './target/*' 2>/dev/null | head -n 1)
            if [ -z "$src" ]; then
              echo "::error::未找到匹配 $1 的产物；全盘搜索：$(find . -maxdepth 4 -name "$1" 2>/dev/null | tr '\n' ' ')"
              exit 1
            fi
            echo "::notice::找到产物 $src"
            cp "$src" "dist/$2"
          }
          case "$tgt" in
            windows-*)
              copy_one "*setup*.exe" "ferric-${tag}-${tgt}-setup.exe"
              # 免安装便携版：单二进制直接分发
              cp target/release/ferric.exe "dist/ferric-${tag}-${tgt}-portable.exe"
              ;;
            macos-*)
              copy_one "*.dmg" "ferric-${tag}-${tgt}.dmg"
              ;;
            linux-*)
              copy_one "*.deb" "ferric-${tag}-${tgt}.deb"
              copy_one "*.AppImage" "ferric-${tag}-${tgt}.AppImage"
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
