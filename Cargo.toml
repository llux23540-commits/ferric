[workspace]
resolver = "2"
members = ["crates/ferric-core", "crates/ferric-ui", "crates/ferric-app"]
# plugins/ 下是独立编译到 wasm32 的插件示例，不属于主工作区
exclude = ["plugins"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Ferric"]

[workspace.dependencies]
# Internal
ferric-core = { path = "crates/ferric-core" }
ferric-ui = { path = "crates/ferric-ui" }

# GUI
eframe = { version = "0.35", default-features = false, features = ["wgpu", "persistence", "wayland", "x11"] }
egui = "0.35"
egui_json_tree = "0.16"

# Serialization / data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Tools
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v5", "v6", "v7"] }
similar = { version = "2", features = ["inline"] }
rfd = "0.14"
serde_yaml = "0.9"
sqlformat = "0.2"
fancy-regex = "0.13"
rsa = "0.9"
rand = "0.8"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
des = "0.8"
sm4 = "0.5"
cipher = "0.4"
ctr = "0.9"
cfb-mode = "0.8"
ofb = "0.6"
md-5 = "0.10"
base64 = "0.22"
smcrypto = "0.3"

# Platform
directories = "5"

# 自动更新：与服务端 ferric-server 走同一套国密传输加密。
# 刻意选 libsm 而不是复用已有的 smcrypto —— 服务端用的就是 libsm，同库同线格式，
# 三个跨实现的坑（C1C2C3 顺序、C1 的 04 前缀、16 字节 IV）直接不存在。
# ⚠️ 二进制里因此同时存在 smcrypto（GM 工具视图）与 libsm（传输层），两者默认线格式不兼容，
#    别为了「统一一下」把传输层换掉 —— 换了就静默打断协议。
libsm = "0.6"
# 阻塞式 HTTP，契合既有的「后台线程 + mpsc」模式，不引入 async runtime。
# tls feature 走 rustls（不依赖系统 OpenSSL，交叉编译到 aarch64-pc-windows-msvc 不会踩 openssl-sys）。
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
