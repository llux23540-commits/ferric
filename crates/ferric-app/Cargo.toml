[package]
name = "ferric-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "ferric"
path = "src/main.rs"

[dependencies]
ferric-ui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# eframe 0.29 只给 wgpu 开了 metal/webgpu，未开 Windows 的 DX12 后端。
# 显式启用 dx12（feature 合并到 eframe 共用的 wgpu 构建），
# 否则在无 Vulkan 驱动 / GL 仅 1.1 的环境（如 QEMU 虚拟机的 WARP 软件渲染）下找不到适配器。
wgpu = { version = "29", default-features = false, features = ["dx12"] }

[build-dependencies]
# 把 icon.ico 嵌进 Windows exe 的 PE 资源（见 build.rs）。
winresource = "0.1"

# 打包配置（cargo-packager）。安装：cargo install cargo-packager
# 构建产物：cargo packager --release
[package.metadata.packager]
product-name = "Ferric"
identifier = "dev.ferric.app"
description = "跨平台原生 Rust 开发者工具箱"
authors = ["Ferric"]
formats = ["dmg", "nsis", "deb", "appimage"]
# 各平台按扩展名自取：ico → Windows(NSIS)，icns → macOS(dmg)，png → Linux(deb/appimage)。
# 图标源文件与再生成方式见 icons/generate.py。
icons = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.png",
    "icons/icon.ico",
    "icons/icon.icns",
]

[package.metadata.packager.macos]
# ad-hoc 签名（"-"，不需要 Apple 证书）。cargo-packager 不配 signing-identity 就
# **完全不签**，而 Apple Silicon 对未签名 .app 直接判「已损坏，无法打开」，连
# 放行入口都没有（v0.2.1 拆包实证：bundle 里没有 _CodeSignature）。ad-hoc 之后
# 首次打开走「系统设置 → 隐私与安全性 → 仍要打开」。将来有 Developer ID 证书时，
# 这里换成证书名并在 CI 配 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD。
signing-identity = "-"
