[package]
name = "slint-spike"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "slint-spike"
path = "src/main.rs"

# 大文本压力测试（判定 JSON 工具能否用原生 TextEdit）
[[bin]]
name = "rope-spike"
path = "src/rope.rs"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["renderer-software", "backend-winit", "std", "libm", "image-default-formats", "software-renderer-systemfonts", "compat-1-2"] }
chrono = { workspace = true }

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"